[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maira-infinity"
version = "12.7.3"
description = "MAIRA-∞ - Limitless AI Desktop Assistant with Voice-Reactive Avatar"
authors = [{name = "MAIRA Team", email = "team@maira.ai"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PySide6>=6.7.0",
    "qasync>=0.27.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "anthropic>=0.25.0",
    "openai>=1.30.0",
    "google-generativeai>=0.5.0",
    "ollama>=0.2.0",
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "webrtcvad>=2.0.10",
    "edge-tts>=6.1.0",
    "psutil>=5.9.0",
    "pynvml>=11.4.0",
    "keyring>=24.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "tomli-w>=1.0.0",
    "playwright>=1.40.0",
    "astral>=3.2.0",
    "Pillow>=10.0.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-qt>=4.2.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "black>=23.0.0",
]

[project.scripts]
maira = "maira.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "B", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
asyncio_mode = "auto"